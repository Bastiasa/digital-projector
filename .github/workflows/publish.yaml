on:
  workflow_dispatch:

name: Publish release

permissions:
    contents:
        write

jobs:
  release-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: npm install

      - run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage

  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.{exe,nsis}

  release-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg
  
  create-release:
    needs:
      - release-linux
      - release-windows
      - release-mac

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          merge-multiple: true
          path: dist

      - name: Get version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            dist/*.exe \
            dist/*.AppImage \
            dist/*.dmg \
            --title "v$VERSION" \
            --generate-notes